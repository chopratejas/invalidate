name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" chromadb langgraph qdrant-client llama-index-core
      - run: ./scripts/check_secrets.sh
      - run: pytest -q
      - run: python evals/run_eval.py --dry-run --no-sweep | head -12
